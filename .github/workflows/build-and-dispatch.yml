name: Build and dispatch

# Drop into an app repo's .github/workflows/ directory.
#
# On every push to main: builds a Docker image, pushes to GHCR with both
# :latest and :sha-<commit> tags, then fires a repository_dispatch event
# at the infrastructure repo to trigger a deploy.
#
# Also runs on:
#   - repository_dispatch "cv-updated" — fired by pjunak/cv when new CV PDFs
#     are published, so the site picks them up immediately.
#   - a weekly schedule — fallback so fresh CV PDFs land even if the
#     dispatch from pjunak/cv isn't configured.
# The build fetches cv-en.pdf / cv-cz.pdf from pjunak/cv's rolling "latest"
# release before the image is built; the committed copies in assets/ are a
# local-dev fallback only.
#
# Required configuration in the app repo (Settings → Secrets and variables → Actions):
#   Secret   INFRA_DISPATCH_TOKEN   fine-grained PAT for the infra repo
#   Variable INFRA_REPO             owner/infra-repo (e.g. pjunak/junak.eu)
#   Variable INFRA_SERVICE          stack directory name (e.g. tiamat)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated]
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC — weekly CV refresh fallback

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.digest && format('{0}@{1}', steps.img.outputs.name, steps.publish.outputs.digest) || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Syntax-check every site script
        run: |
          for script in js/*.js scripts/*.mjs sw.js; do
            node --check "$script"
          done

      - name: Fetch current CV PDFs from pjunak/cv
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 --retry-max-time 180 -o assets/cv-en.pdf https://github.com/pjunak/cv/releases/latest/download/cv-en.pdf
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 --retry-max-time 180 -o assets/cv-cz.pdf https://github.com/pjunak/cv/releases/latest/download/cv-cz.pdf
          for pdf in assets/cv-en.pdf assets/cv-cz.pdf; do
            [[ "$(head -c 5 "$pdf")" == '%PDF-' ]] || { echo "::error::Invalid PDF: $pdf"; exit 1; }
          done
          ls -l assets/cv-en.pdf assets/cv-cz.pdf

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Build the image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: portfolio:test
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Verify nginx and served pages in the release image
        run: |
          set -euo pipefail
          docker run --rm portfolio:test nginx -t
          container_id=$(docker run --detach --publish 18080:80 portfolio:test)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/ >/dev/null; then break; fi
            if [[ "$attempt" == 30 ]]; then exit 1; fi
            sleep 1
          done
          for page in / /projects/ /models/ /assets/cv-en.pdf /assets/cv-cz.pdf; do
            curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:18080${page}" >/dev/null
          done
          code=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/missing-ci-page)
          [[ "$code" == 404 ]]

      - name: Publish the verified warm build
        id: publish
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha

  dispatch:
    name: Dispatch deploy to infra repo
    needs: build
    if: ${{ needs.build.outputs.image_ref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify dispatch config
        env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          REPO: ${{ vars.INFRA_REPO }}
          SERVICE: ${{ vars.INFRA_SERVICE }}
        run: |
          set -euo pipefail
          : "${TOKEN:?INFRA_DISPATCH_TOKEN secret is not set}"
          : "${REPO:?INFRA_REPO variable is not set (e.g. owner/infra-repo)}"
          : "${SERVICE:?INFRA_SERVICE variable is not set (e.g. tiamat)}"

      - name: Trigger infra deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ${{ vars.INFRA_REPO }}
          event-type: deploy
          client-payload: |-
            {
              "service": "${{ vars.INFRA_SERVICE }}",
              "sha": "${{ github.sha }}",
              "image_ref": "${{ needs.build.outputs.image_ref }}"
            }
