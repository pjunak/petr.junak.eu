name: Build and dispatch

# Main publishes a verified image and waits for infra deployment.
# Weekly builds publish refreshed Printables statistics. CV PDFs are built
# independently by pjunak/cv and linked directly from the website.
# Required: INFRA_REPO and the shared INFRA_DISPATCH_TOKEN.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC - publish refreshed Printables statistics

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Verify and build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.digest && format('{0}@{1}', steps.img.outputs.name, steps.publish.outputs.digest) || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Syntax-check every site script
        run: |
          for script in js/*.js scripts/*.mjs sw.js; do
            node --check "$script"
          done

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Build the image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: portfolio:test
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Verify nginx and served pages in the release image
        run: |
          set -euo pipefail
          docker run --rm portfolio:test nginx -t
          container_id=$(docker run --detach --publish 18080:80 portfolio:test)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/ >/dev/null; then break; fi
            if [[ "$attempt" == 30 ]]; then exit 1; fi
            sleep 1
          done
          for page in / /projects/ /models/; do
            curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:18080${page}" >/dev/null
          done
          for language in en cz; do
            headers=$(curl --silent --show-error --max-time 10 --dump-header - --output /dev/null "http://127.0.0.1:18080/assets/cv-${language}.pdf")
            printf '%s' "$headers" | grep -q 'HTTP/1.1 302'
            printf '%s' "$headers" | grep -qi "Location: https://github.com/pjunak/cv/releases/latest/download/cv-${language}.pdf"
          done
          code=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/missing-ci-page)
          [[ "$code" == 404 ]]

      - name: Skip superseded main revisions
        id: current
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$main_sha" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A newer main revision exists; publication and deployment skipped.'
          fi

      - name: Publish the verified warm build
        id: publish
        if: steps.current.outputs.current == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha

      - name: Retain published release metadata
        if: steps.current.outputs.current == 'true'
        env:
          IMAGE_REF: ${{ format('{0}@{1}', steps.img.outputs.name, steps.publish.outputs.digest) }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          mkdir -p release
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg image "$IMAGE_REF" \
            '{format: 1, repository: $repository, sha: $sha, image_ref: $image}' > release/published-image.json
      - uses: actions/upload-artifact@v4
        if: steps.current.outputs.current == 'true'
        with:
          name: published-image
          path: release/published-image.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy and verify petr
    needs: build
    if: needs.build.outputs.image_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.INFRA_REPO }}
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          ref: 3e220931eb61ae311d3371674c921a047581dcc9
          persist-credentials: false
          sparse-checkout: scripts/application-release.py
          sparse-checkout-cone-mode: false
      - name: Dispatch and wait for infrastructure health
        run: python3 scripts/application-release.py deploy
        env:
          APP_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          DEPLOY_SERVICE: petr
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_IMAGE: ${{ needs.build.outputs.image_ref }}
